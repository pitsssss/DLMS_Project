[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Production push worker (F4): started by entrypoint.sh → supervisord.
; Timeout chain: FCM HTTP 15s < --timeout=60 < DB_QUEUE_RETRY_AFTER=120
; stopwaitsecs must exceed job --timeout so graceful stop can finish.
[program:queue-push]
command=php /var/www/html/artisan queue:work --queue=push,default --sleep=1 --tries=25 --timeout=60 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=30
numprocs=1
startsecs=3
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=90
stopasgroup=true
killasgroup=true
